<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>TRAINING HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--surface:#16181c;--surface2:#1e2126;--border:#2b2f35;--text:#f3f4f6;--dim:#868d97;--dim2:#5b6169;--flame:#b7e332;--flame-dim:#293219}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,#171a1f 0%,transparent 45%),radial-gradient(circle at 100% 0%,#14181d 0%,transparent 40%),var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:auto;min-height:100vh;padding:0 16px 40px}
.topbar{padding:28px 2px 18px;border-bottom:1px solid var(--border);margin-bottom:16px}
.eyebrow{font-size:10px;letter-spacing:2.5px;color:var(--flame);font-weight:700;margin-bottom:5px}
h1{font-family:'Anton',sans-serif;font-size:30px;font-weight:400;letter-spacing:.5px;text-transform:uppercase;margin:0;line-height:1}
.sub{color:var(--dim);font-size:12px;margin:8px 0 0}
nav{display:grid;gap:10px}
.nav-btn{width:100%;min-height:76px;display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:14px;font-weight:800;letter-spacing:.6px;transition:background .15s,transform .15s}
.nav-btn:active{background:var(--surface2);transform:scale(.985)}
.nav-btn .arrow{color:var(--flame);font-size:20px;font-weight:500}
.nav-btn.blank{justify-content:flex-start}
.nav-btn.blank .arrow{visibility:hidden}
footer{margin-top:22px;text-align:center;color:var(--dim2);font:10px 'JetBrains Mono',monospace;letter-spacing:1.5px}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
<div class="eyebrow">DAY ON / DAY OFF</div>
<h1>TRAINING HUB</h1>
<p class="sub">トレーニングメニューを選択</p>
</header>
<nav aria-label="トレーニングメニュー">
<a class="nav-btn" href="/TRANING-AI/"><span>TRAINING AI</span><span class="arrow">›</span></a>
<a class="nav-btn" href="/Push-up/"><span>CHEST &amp; ARM</span><span class="arrow">›</span></a>
<a class="nav-btn" href="/LEG-CORE/index-1.html"><span>LEG &amp; CORE</span><span class="arrow">›</span></a>
<a class="nav-btn blank" href="/TRANING-AI/timer.html" aria-label="タイマー"><span></span><span class="arrow" aria-hidden="true">›</span></a>
</nav>
<footer>TRAINING SYSTEM</footer>
</main>
</body>
</html>
