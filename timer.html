<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#0a0b0d">
<title>INTERVAL TIMER</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--surface:#16181c;--surface2:#1e2126;--border:#2b2f35;--text:#f3f4f6;--dim:#868d97;--dim2:#5b6169;--flame:#b7e332;--flame-dim:#293219;--steel:#5b9cff;--steel-dim:#1c2a3f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,#171a1f 0%,transparent 45%),radial-gradient(circle at 100% 0%,#14181d 0%,transparent 40%),var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:auto;min-height:100vh;padding:0 16px 40px}.mono{font-family:'JetBrains Mono',monospace}.display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.5px;text-transform:uppercase}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;padding:22px 2px 16px;border-bottom:1px solid var(--border);margin-bottom:16px}.brand-eyebrow{font-size:10px;letter-spacing:2.5px;color:var(--flame);font-weight:700;margin-bottom:4px}.brand h1{display:block;font-size:26px;margin:0;line-height:1}
.iconbtn{background:var(--surface);border:1px solid var(--border);color:var(--dim);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;font-size:15px;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;margin:12px 0}.wk-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.wk-step{font-size:11px;color:var(--dim);letter-spacing:1px;font-family:'JetBrains Mono',monospace}
.tag{font-size:10px;font-weight:700;letter-spacing:1px;padding:5px 9px;border-radius:8px;background:var(--surface2);color:var(--dim);border:1px solid var(--border)}.tag.flame{background:var(--flame-dim);color:var(--flame);border-color:#3e4a22}.tag.steel{background:var(--steel-dim);color:var(--steel);border-color:#22385a}
.progress{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:14px 0 18px}.bar{height:100%;width:0;background:var(--flame);transition:width .25s ease}
.rest-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 18px 18px}.ring-box{position:relative;width:190px;height:190px;margin:6px auto 4px}.ring-box svg{transform:rotate(-90deg);width:100%;height:100%}.ring-bg{fill:none;stroke:var(--surface2);stroke-width:9}.ring-fg{fill:none;stroke:var(--flame);stroke-width:9;stroke-linecap:round;transition:stroke .2s}.ring-fg.rest{stroke:var(--steel)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring-center .time{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}.ring-center .label{font-size:10.5px;color:var(--flame);letter-spacing:2px;margin-top:2px}.ring-center .label.rest{color:var(--steel)}
.next-preview{font-size:12px;color:var(--dim);text-align:center;margin:4px 0 16px;min-height:18px}.sets{display:flex;gap:6px;width:100%;margin:0 0 16px}.set-dot{flex:1;height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--border)}.set-dot.done{background:var(--flame);border-color:var(--flame)}.set-dot.current{background:var(--surface2);border:1.5px dashed var(--flame)}
.btn{border:0;border-radius:14px;padding:16px;font-weight:700;font-size:14.5px;letter-spacing:.5px;cursor:pointer;width:100%;font-family:'Inter',sans-serif}.btn-flame{background:var(--flame);color:#141c04;box-shadow:0 8px 20px -8px rgba(183,227,50,.5)}.btn-flame:active{transform:scale(.98)}.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-row{display:flex;gap:9px;width:100%}.btn-row .btn{flex:1}.btn:disabled{opacity:.45;cursor:not-allowed}
.finish{text-align:center;padding:34px 10px 10px}.check-ring{width:64px;height:64px;border-radius:50%;background:#12301f;border:1.5px solid #3ddc84;display:grid;place-items:center;margin:0 auto 16px;font-size:28px;color:#3ddc84}.finish h2{margin:0 0 6px;font-size:23px}.finish p{color:var(--dim);font-size:13px;margin:0 0 22px}.hidden{display:none!important}
</style></head>
<body><main class="app">
<header class="topbar"><div class="brand"><div class="brand-eyebrow">TRAINING SYSTEM</div><h1 class="display">INTERVAL TIMER</h1></div><a class="iconbtn" href="/TRANING-AI/" title="ホームへ戻る">⌂</a></header>
<div class="wk-top"><span class="wk-step mono" id="stepLabel">SET 1 / 3</span><span class="tag flame" id="category">TRAINING</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card rest-wrap" id="timerCard">
<div class="ring-box"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-bg" cx="50" cy="50" r="43"></circle><circle class="ring-fg" id="ringFg" cx="50" cy="50" r="43" stroke-dasharray="270.2" stroke-dashoffset="0"></circle></svg>
<div class="ring-center"><div class="time mono" id="time">00:30</div><div class="label" id="phaseLabel">TRAINING</div></div></div>
<div class="next-preview" id="nextPreview">次: 休憩 5秒</div>
<div class="sets" id="sets"><span class="set-dot current"></span><span class="set-dot"></span><span class="set-dot"></span></div>
<button class="btn btn-flame" id="start" onclick="start()">開始</button>
<div class="btn-row" style="margin-top:9px"><button class="btn btn-ghost" id="pause" onclick="togglePause()" disabled>一時停止</button><button class="btn btn-ghost" onclick="skip()">スキップ</button></div>
<button class="btn btn-ghost" style="margin-top:9px" onclick="reset()">リセット</button>
</section>
<section class="card finish hidden" id="finish"><div class="check-ring">✓</div><h2 class="display">COMPLETE</h2><p>全3セット完了。お疲れさま。</p><button class="btn btn-flame" onclick="reset()">もう一度</button></section>
</main>
<script>
const RING_C=2*Math.PI*43;
const steps=[];
for(let set=1;set<=3;set++){steps.push({name:"トレーニング",label:"TRAINING",seconds:30,set,kind:"train"});steps.push({name:"休憩",label:"REST",seconds:5,set,kind:"rest"});steps.push({name:"トレーニング",label:"TRAINING",seconds:30,set,kind:"train"});if(set<3)steps.push({name:"セット間休憩",label:"SET REST",seconds:30,set,kind:"rest"});}
let index=0,remaining=30,interval=null,running=false,paused=false;const $=id=>document.getElementById(id);
function nextDescription(){const next=steps[index+1];return next?"次: "+next.name+" "+next.seconds+"秒":"全セット完了";}
function draw(){const step=steps[index],fraction=remaining/step.seconds;$("stepLabel").textContent="SET "+step.set+" / 3";$("category").textContent=step.kind==="rest"?"REST":"TRAINING";$("category").className="tag "+(step.kind==="rest"?"steel":"flame");$("phaseLabel").textContent=step.label;$("phaseLabel").className="label"+(step.kind==="rest"?" rest":"");$("time").textContent="00:"+String(Math.max(0,remaining)).padStart(2,"0");$("ringFg").classList.toggle("rest",step.kind==="rest");$("ringFg").style.strokeDasharray=RING_C;$("ringFg").style.strokeDashoffset=RING_C*(1-fraction);$("bar").style.width=((index+(1-fraction))/steps.length*100)+"%";$("nextPreview").textContent=nextDescription();$("sets").innerHTML=Array.from({length:3},(_,i)=>'<span class="set-dot '+(i<step.set-1?"done":i===step.set-1?"current":"")+'"></span>').join("");}
function finish(){clearInterval(interval);interval=null;running=false;$("timerCard").classList.add("hidden");$("finish").classList.remove("hidden");$("bar").style.width="100%";}
function start(){if(index>=steps.length)reset();if(running)return;running=true;paused=false;$("start").disabled=true;$("pause").disabled=false;$("pause").textContent="一時停止";interval=setInterval(()=>{if(paused)return;remaining--;if(remaining<=0){index++;if(index>=steps.length){finish();return;}remaining=steps[index].seconds;}draw();},1000);}
function togglePause(){if(!running)return;paused=!paused;$("pause").textContent=paused?"再開":"一時停止";}
function skip(){if(index>=steps.length)return;index++;if(index>=steps.length){finish();return;}remaining=steps[index].seconds;draw();}
function reset(){clearInterval(interval);interval=null;index=0;remaining=30;running=false;paused=false;$("timerCard").classList.remove("hidden");$("finish").classList.add("hidden");$("start").disabled=false;$("start").textContent="開始";$("pause").disabled=true;$("pause").textContent="一時停止";draw();}
draw();
</script></body></html>
