<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101216">
<title>INTERVAL TIMER</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#101216;color:#f5f7fa;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:480px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
a{color:#9299a6;text-decoration:none;font-size:13px}
h1{font-size:19px;letter-spacing:2px;margin:0}
.card{background:#191c22;border:1px solid #292d36;border-radius:20px;padding:26px 20px;text-align:center}
.label{color:#9299a6;font-size:12px;letter-spacing:2px}
.phase{font-size:23px;font-weight:800;margin:12px 0}
.time{font:700 clamp(64px,20vw,100px)/1.1 ui-monospace,monospace;font-variant-numeric:tabular-nums;margin:18px 0}
.progress{color:#9299a6;font-size:13px;margin-bottom:20px}
button{width:100%;border:0;border-radius:13px;padding:16px;font-size:15px;font-weight:750;margin-top:9px;background:#f3f4f6;color:#111}
button.secondary{background:#252932;color:#fff;border:1px solid #343945}
button:disabled{opacity:.45}
</style>
</head>
<body>
<main>
<div class="top"><a href="/TRANING-AI/">← ホーム</a><h1>INTERVAL TIMER</h1><span></span></div>
<div class="card">
<div class="label" id="setLabel">SET 1 / 3</div>
<div class="phase" id="phase">READY</div>
<div class="time" id="time">00:30</div>
<div class="progress" id="progress">30秒トレーニング → 5秒休憩 → 30秒トレーニング</div>
<button id="start" onclick="start()">開始</button>
<button id="pause" class="secondary" onclick="togglePause()" disabled>一時停止</button>
<button class="secondary" onclick="reset()">リセット</button>
</div>
</main>
<script>
const steps=[];
for(let set=1;set<=3;set++){
 steps.push({name:"トレーニング",seconds:30,set});
 steps.push({name:"休憩",seconds:5,set});
 steps.push({name:"トレーニング",seconds:30,set});
 if(set<3)steps.push({name:"セット間休憩",seconds:30,set});
}
let index=0,remaining=30,interval=null,running=false,paused=false;
const $=id=>document.getElementById(id);
function draw(){
 const step=steps[index];
 $("setLabel").textContent="SET "+step.set+" / 3";
 $("phase").textContent=step.name;
 $("time").textContent="00:"+String(Math.max(0,remaining)).padStart(2,"0");
 $("progress").textContent=step.name==="セット間休憩"?"次のセットまで休憩":"30秒トレーニング → 5秒休憩 → 30秒トレーニング";
}
function start(){
 if(running)return;
 running=true;paused=false;$("start").disabled=true;$("pause").disabled=false;$("pause").textContent="一時停止";
 interval=setInterval(()=>{
  if(paused)return;
  remaining--;
  if(remaining<=0){
   index++;
   if(index>=steps.length){clearInterval(interval);running=false;$("phase").textContent="COMPLETE";$("time").textContent="DONE";$("progress").textContent="全3セット完了";$("start").disabled=false;$("start").textContent="もう一度";$("pause").disabled=true;return;}
   remaining=steps[index].seconds;
  }
  draw();
 },1000);
}
function togglePause(){paused=!paused;$("pause").textContent=paused?"再開":"一時停止";}
function reset(){clearInterval(interval);index=0;remaining=30;running=false;paused=false;$("start").disabled=false;$("start").textContent="開始";$("pause").disabled=true;$("pause").textContent="一時停止";draw();}
draw();
</script>
</body>
</html>
