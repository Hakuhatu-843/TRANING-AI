<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>INTERVAL TIMER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--surface:#16181c;--surface2:#1e2126;--border:#2b2f35;--text:#f3f4f6;--dim:#868d97;--dim2:#5b6169;--flame:#b7e332;--flame-dim:#293219;--steel:#5b9cff;--steel-dim:#1c2a3f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% -10%,#171a1f 0%,transparent 45%),radial-gradient(circle at 100% 0%,#14181d 0%,transparent 40%),var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:auto;min-height:100vh;padding:0 16px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 2px 16px;border-bottom:1px solid var(--border);margin-bottom:16px}
.back{color:var(--dim);text-decoration:none;font-size:12px;font-weight:600}
.eyebrow{font-size:10px;letter-spacing:2px;color:var(--flame);font-weight:700;text-align:right}
h1{font-family:'Anton',sans-serif;font-size:25px;font-weight:400;letter-spacing:.5px;text-transform:uppercase;margin:2px 0 0;text-align:right}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px 18px;text-align:center}
.status{font-size:11px;letter-spacing:2px;color:var(--flame);font-weight:800}
.phase{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:.5px;margin:12px 0 2px;text-transform:uppercase}
.time{font:700 clamp(64px,19vw,88px)/1.1 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-3px;margin:15px 0 12px;color:var(--text)}
.progress{color:var(--dim);font-size:12px;line-height:1.6;min-height:40px;margin-bottom:16px}
.sets{display:flex;gap:7px;margin:0 0 20px}
.set-dot{height:7px;flex:1;border-radius:5px;background:var(--surface2);border:1px solid var(--border)}
.set-dot.active{background:var(--flame);border-color:var(--flame)}
.set-dot.done{background:var(--flame-dim);border-color:#465526}
button{width:100%;border:0;border-radius:14px;padding:16px;font-family:'Inter',sans-serif;font-size:14px;font-weight:800;letter-spacing:.4px;cursor:pointer}
.primary{background:var(--flame);color:#141c04;box-shadow:0 8px 20px -8px rgba(183,227,50,.35)}
.primary:active{transform:scale(.985)}
.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
button:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:9px;margin-top:9px}
.btnrow button{flex:1}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
<a class="back" href="/TRANING-AI/">← HOME</a>
<div><div class="eyebrow">TRAINING SYSTEM</div><h1>INTERVAL TIMER</h1></div>
</header>
<section class="card">
<div class="status" id="setLabel">SET 1 / 3</div>
<div class="phase" id="phase">READY</div>
<div class="time" id="time">00:30</div>
<div class="progress" id="progress">30秒トレーニング → 5秒休憩 → 30秒トレーニング</div>
<div class="sets" id="sets"><span class="set-dot active"></span><span class="set-dot"></span><span class="set-dot"></span></div>
<button class="primary" id="start" onclick="start()">開始</button>
<div class="btnrow">
<button class="secondary" id="pause" onclick="togglePause()" disabled>一時停止</button>
<button class="secondary" onclick="reset()">リセット</button>
</div>
</section>
</main>
<script>
const steps=[];
for(let set=1;set<=3;set++){
 steps.push({name:"トレーニング",seconds:30,set});
 steps.push({name:"休憩",seconds:5,set});
 steps.push({name:"トレーニング",seconds:30,set});
 if(set<3)steps.push({name:"セット間休憩",seconds:30,set});
}
let index=0,remaining=30,interval=null,running=false,paused=false;
const $=id=>document.getElementById(id);
function draw(){
 const step=steps[index];
 $("setLabel").textContent="SET "+step.set+" / 3";
 $("phase").textContent=step.name;
 $("time").textContent="00:"+String(Math.max(0,remaining)).padStart(2,"0");
 $("progress").textContent=step.name==="セット間休憩"?"次のセットまで休憩":"30秒トレーニング → 5秒休憩 → 30秒トレーニング";
 $("sets").innerHTML=Array.from({length:3},(_,i)=>'<span class="set-dot '+(i<step.set-1?'done':i===step.set-1?'active':'')+'"></span>').join("");
}
function start(){
 if(index>=steps.length)reset();
 if(running)return;
 running=true;paused=false;$("start").disabled=true;$("pause").disabled=false;$("pause").textContent="一時停止";
 interval=setInterval(()=>{
  if(paused)return;
  remaining--;
  if(remaining<=0){
   index++;
   if(index>=steps.length){clearInterval(interval);running=false;$("phase").textContent="COMPLETE";$("time").textContent="DONE";$("progress").textContent="全3セット完了";$("start").disabled=false;$("start").textContent="もう一度";$("pause").disabled=true;return;}
   remaining=steps[index].seconds;
  }
  draw();
 },1000);
}
function togglePause(){paused=!paused;$("pause").textContent=paused?"再開":"一時停止";}
function reset(){clearInterval(interval);index=0;remaining=30;running=false;paused=false;$("start").disabled=false;$("start").textContent="開始";$("pause").disabled=true;$("pause").textContent="一時停止";draw();}
draw();
</script>
</body>
</html>
